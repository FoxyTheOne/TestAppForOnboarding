plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
//    id 'kotlin-android' // <-- УДАЛИТЕ ЭТУ СТРОКУ, это старый дубликат плагина org.jetbrains.kotlin.android
//    // 2. Hilt (new)
    id 'com.google.devtools.ksp' // Заменяем kotlin-kapt на ksp
    id 'com.google.dagger.hilt.android'
    // 2. Hilt (old)
//    id 'kotlin-kapt'
//    id 'dagger.hilt.android.plugin'
    // Navigation pass data
    id 'androidx.navigation.safeargs'
//    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.gms.google-services'
    // Parcelable implementation generator
    id 'kotlin-parcelize'
}

android {
    namespace 'com.foxynest.testappforonboarding'
    compileSdk 36

    defaultConfig {
        applicationId "com.foxynest.testappforonboarding"
        minSdk 29
        targetSdk 36
        // versionCode - используется Android и Google Play для определения, какая версия приложения новее и для автоматического обновления. Всегда увеличивайте versionCode при каждой новой сборке приложения, даже если вы не меняете versionName. Это гарантирует, что Android сможет правильно отслеживать обновления.
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // Название файла
        applicationVariants.all { variant ->
            variant.outputs.all { output ->

                def APP_TITLE = "TestAppWithOnboarding"
                def SEPARATOR = "_"

                // какой билд (зависит от того, какой выбрали в Active Build Variant)
                def buildType = variant.buildType.name
                // versionName, который мы указали в defaultConfig -> versionName
                def version = variant.versionName
                // инициализация объекта даты
                def date = new Date()
                // указываем формат даты типа "09.11.21"
                def formattedDate = date.format('dd.MM.yy')

                // объединяем все в одну строчку
                def apkName = APP_TITLE + SEPARATOR + version + SEPARATOR + buildType + SEPARATOR + formattedDate + ".apk"

                // создем APK файл с названием $apkName
                outputFileName = new File(apkName)
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            // android.util.Log и прочие заглушки android.jar в JVM-тестах возвращают значения по умолчанию, а не падают
            returnDefaultValues = true
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    "META-INF/LICENSE.md",
                    "META-INF/LICENSE-notice.md",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1",
                    "META-INF/DEPENDENCIES",
                    "META-INF/*.kotlin_module"
            ]
            pickFirsts += [
                    "META-INF/LICENSE",
                    "META-INF/io.netty.versions.properties",
                    "META-INF/INDEX.LIST"
            ]
        }
    }
}

dependencies {
//    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.firebase:firebase-firestore:26.5.0'

    // Lifecycle
//    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0" // В файле build.gradle модуля (app) удалите эту строчку. Она не нужна, давно устарела и вызывает внутренние конфликты в SavedState
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.9.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.2"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'

    // For activityViewModels working:
    // Java language implementation, Kotlin
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    // Testing Fragments in Isolation
    debugImplementation "androidx.fragment:fragment-testing:1.8.9"

    // Material design
    implementation 'com.google.android.material:material:1.14.0'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'

    // Preferences DataStore (SharedPreferences like APIs)
    implementation "androidx.datastore:datastore-preferences:1.1.7"

    // 3. Hilt
    implementation "com.google.dagger:hilt-android:2.56.2"
    ksp "com.google.dagger:hilt-compiler:2.56.2"

    // Firebase
    implementation 'com.google.firebase:firebase-auth:24.0.1'

    // Корутины
    // Standart
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
    // For firebase
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Unit тесты (test/)
    // Тестирование - по умолчанию
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Тестирование - основные тестовые библиотеки
    testImplementation 'androidx.test:core:1.5.0'
    // For local unit tests (src/test)
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    // For instrumented tests on a device/emulator (src/androidTest)
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'io.mockk:mockk:1.13.8'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    // Тестирование - для тестирования Android компонентов
    androidTestImplementation 'io.mockk:mockk-android:1.13.8'

    // Тестирование - navigation testing
    androidTestImplementation 'androidx.navigation:navigation-testing:2.7.4'
//    debugImplementation 'androidx.fragment:fragment-testing:1.6.2' Дублируется

    // Тестирование - robolectric для unit-тестов фрагментов
    testImplementation 'org.robolectric:robolectric:4.10'

    // Инструментальные тесты (androidTest/)
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'

    // Gson для конвертации в JSON
    // Сохраняемые классы описаны в StoredModels.kt с @SerializedName и @Keep – включать minifyEnabled безопасно.
    // Новые классы для Gson добавляйте так же, иначе R8 переименует поля и сохранённые данные перестанут читаться
    implementation 'com.google.code.gson:gson:2.10.1'
}

